<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<title>HiFi Server</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: dark; --bg:#101214; --card:#191d21; --fg:#eef1f4; --mut:#98a2ac; --acc:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:17px; margin:0 0 14px; font-weight:600; letter-spacing:.2px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; }
  .title { font-size:19px; font-weight:600; margin-bottom:2px; word-break:break-word; }
  .sub { color:var(--mut); font-size:14px; }
  .badge { display:inline-block; margin-top:8px; padding:3px 9px; border-radius:999px;
           background:#25303a; color:var(--acc); font-size:12px; font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { flex:1 1 auto; min-width:64px; padding:12px 10px; font-size:15px; border:0; border-radius:10px;
           background:#242a30; color:var(--fg); cursor:pointer; }
  button:active { background:#2f373f; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  select { width:100%; padding:10px; border-radius:10px; background:#242a30; color:var(--fg); border:0; font-size:15px; }
  .bar { height:4px; background:#2a3138; border-radius:2px; overflow:hidden; margin:10px 0 4px; }
  .bar > i { display:block; height:100%; background:var(--acc); width:0; }
  .meta { display:flex; justify-content:space-between; color:var(--mut); font-size:12px;
          font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#d9534f; margin-right:6px; }
  .dot.ok { background:#54c06e; }
  .list { list-style:none; margin:0; padding:0; max-height:46vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .list li { display:flex; gap:10px; align-items:center; padding:10px 6px; border-bottom:1px solid #222a31; cursor:pointer; }
  .list li:last-child { border-bottom:0; }
  .list li:active { background:#222a31; }
  .list img { width:40px; height:40px; border-radius:6px; object-fit:cover; flex:0 0 auto; background:#242a30; }
  .list .txt { min-width:0; flex:1 1 auto; }
  .list .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list .s { color:var(--mut); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hdr { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .hdr button { flex:0 0 auto; min-width:0; padding:6px 12px; font-size:13px; }
  .act { flex:0 0 auto; background:#2a323a; border:0; color:var(--fg); border-radius:8px; padding:8px 10px; font-size:13px; cursor:pointer; }
  .act.done { color:#54c06e; background:transparent; }
  .syncbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .syncbar .sub { flex:1 1 auto; }
  .tabs { display:flex; gap:6px; }
  .tab { flex:0 0 auto; min-width:0; padding:6px 14px; font-size:13px; background:#20262c; color:var(--mut); border-radius:999px; }
  .tab.on { background:#2f3b46; color:var(--fg); }
  #lib-search { width:100%; padding:10px; margin-bottom:8px; border:0; border-radius:10px; background:#242a30; color:var(--fg); font-size:15px; }
  .list .meta { flex:0 0 auto; text-align:right; color:var(--mut); font-size:12px; line-height:1.35; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .list .meta b { color:var(--fg); font-weight:500; }
  #lib-summary { margin:-2px 0 8px; }
  .volrow { display:flex; align-items:center; gap:10px; }
  .volrow input { flex:1 1 auto; }
  .volrow .act { min-width:44px; font-size:18px; padding:6px 0; }
</style>
</head>
<body>
<h1><span id="dot" class="dot"></span><span id="server">HiFi Server</span></h1>

<div class="card">
  <div class="title" id="title">Nothing playing</div>
  <div class="sub" id="artist"></div>
  <div class="badge" id="fmt">—</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="meta"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
</div>

<div class="card row">
  <button id="prev" aria-label="Previous">⏮</button>
  <button id="playpause" aria-label="Play">▶</button>
  <button id="stop" aria-label="Stop">⏹</button>
  <button id="next" aria-label="Next">⏭</button>
</div>

<div class="card">
  <div class="sub">Volume <span id="volval"></span></div>
  <div class="volrow">
    <button class="act" id="vol-down" aria-label="Volume down 1%">−</button>
    <input id="vol" type="range" min="0" max="100" value="0">
    <button class="act" id="vol-up" aria-label="Volume up 1%">+</button>
  </div>
</div>

<div class="card">
  <div class="sub" style="margin-bottom:8px">Output</div>
  <select id="outputs"></select>
</div>

<div class="card">
  <div class="hdr">
    <div class="tabs">
      <button class="tab on" id="tab-ncm">NetEase</button>
      <button class="tab" id="tab-lib">Library</button>
    </div>
    <button id="browse-back" hidden>← Back</button>
  </div>
  <div class="sub" id="browse-title" style="margin-bottom:6px"></div>
  <input id="lib-search" placeholder="Search library…" hidden>
  <div class="sub" id="lib-summary" hidden></div>
  <div class="syncbar">
    <div class="sub" id="dl-status"></div>
    <button class="act" id="dl-playlist" hidden>Download all</button>
  </div>
  <div id="login-panel" hidden style="text-align:center;padding:8px 0 4px">
    <div class="sub" id="login-msg">Not logged in to NetEase.</div>
    <button class="act" id="login-btn" style="margin:10px 0">Log in with QR code</button>
    <div><img id="login-qr" alt="" hidden style="width:220px;height:220px;border-radius:10px;background:#fff;padding:8px"></div>
  </div>
  <div class="sub" id="browse-status">loading…</div>
  <ul class="list" id="browse-list"></ul>
</div>
<script src="app.js"></script>
</body>
</html>
