<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<title>HiFi Server</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: dark; --bg:#101214; --card:#191d21; --fg:#eef1f4; --mut:#98a2ac; --acc:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:17px; margin:0; font-weight:600; letter-spacing:.2px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 14px; }
  .pwr { padding:5px 9px 3px; margin-left:8px; vertical-align:middle; color:var(--mut); line-height:0; }
  .pwr:hover { color:#e46; }
  .seek { padding:8px 0 4px; margin:2px 0 0; cursor:pointer; }
  .seek .bar { margin:0; }
  .opts .act { flex:1 1 0; padding:9px 10px; }
  .opts .act.on { color:var(--acc); background:#1f3242; }
  .sys { display:flex; flex-wrap:wrap; gap:6px; font-variant-numeric:tabular-nums; }
  .tile { flex:0 0 auto; background:var(--card); border-radius:8px; padding:5px 9px 4px; display:grid;
          grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:8px; align-items:center; }
  .tile .l { grid-column:1; grid-row:1; font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--mut); }
  .tile .v { grid-column:1; grid-row:2; font-size:14px; font-weight:600; color:var(--fg); text-align:right; white-space:pre; }
  .tile .s { grid-column:1 / span 2; grid-row:3; font-size:10px; color:var(--mut); white-space:pre; }
  .tile .ind { grid-column:2; grid-row:1 / span 2; align-self:end; }
  .tile.warn .v { color:#e0a030; } .tile.hot .v { color:#d9534f; }
  .spark { display:block; width:64px; height:22px; }
  .spark polyline { fill:none; stroke:var(--acc); stroke-width:1.4; stroke-linejoin:round; }
  .spark polygon { fill:var(--acc); opacity:.14; }
  .tile.warn .spark polyline, .tile.warn .spark polygon { stroke:#e0a030; fill:#e0a030; }
  .tile.hot .spark polyline, .tile.hot .spark polygon { stroke:#d9534f; fill:#d9534f; }
  .bar2 { width:64px; height:6px; background:#2a3138; border-radius:3px; overflow:hidden; margin-bottom:4px; }
  .bar2 i { display:block; height:100%; background:var(--acc); }
  .sig { display:flex; gap:2px; align-items:flex-end; height:14px; margin-bottom:4px; }
  .sig i { width:5px; background:#2a3138; border-radius:1px; }
  .sig i.on { background:var(--acc); }
  .sig i:nth-child(1){height:5px} .sig i:nth-child(2){height:8px} .sig i:nth-child(3){height:11px} .sig i:nth-child(4){height:14px}
  .indcol { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .indcol .sig { margin-bottom:0; }
  @media (max-width: 640px) {
    .top { display:block; }
    .top h1 { margin-bottom:10px; }
    .sys { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .tile { width:auto; }
  }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; }
  .title { font-size:19px; font-weight:600; margin-bottom:2px; word-break:break-word; }
  .sub { color:var(--mut); font-size:14px; }
  .badge { display:inline-block; margin-top:8px; padding:3px 9px; border-radius:999px;
           background:#25303a; color:var(--acc); font-size:12px; font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { flex:1 1 auto; min-width:64px; padding:12px 10px; font-size:15px; border:0; border-radius:10px;
           background:#242a30; color:var(--fg); cursor:pointer; }
  button:active { background:#2f373f; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  select { width:100%; padding:10px; border-radius:10px; background:#242a30; color:var(--fg); border:0; font-size:15px; }
  .bar { height:4px; background:#2a3138; border-radius:2px; overflow:hidden; margin:10px 0 4px; }
  .bar > i { display:block; height:100%; background:var(--acc); width:0; }
  .meta { display:flex; justify-content:space-between; color:var(--mut); font-size:12px;
          font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#d9534f; margin-right:6px; }
  .dot.ok { background:#54c06e; }
  .list { list-style:none; margin:0; padding:0; max-height:46vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .list li { display:flex; gap:10px; align-items:center; padding:10px 6px; border-bottom:1px solid #222a31; cursor:pointer; }
  .list li:last-child { border-bottom:0; }
  .list li:active { background:#222a31; }
  .list img { width:40px; height:40px; border-radius:6px; object-fit:cover; flex:0 0 auto; background:#242a30; }
  .list .ico { width:40px; height:40px; border-radius:6px; flex:0 0 auto; background:#242a30; display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1; }
  .list .txt { min-width:0; flex:1 1 auto; }
  .list .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list .s { color:var(--mut); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hdr { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .hdr button { flex:0 0 auto; min-width:0; padding:6px 12px; font-size:13px; }
  .act { flex:0 0 auto; background:#2a323a; border:0; color:var(--fg); border-radius:8px; padding:8px 10px; font-size:13px; cursor:pointer; }
  .act.done { color:#54c06e; background:transparent; }
  .act.busy { color:var(--acc); }
  .syncbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .syncbar .sub { flex:1 1 auto; }
  .tabs { display:flex; gap:6px; }
  .tab { flex:0 0 auto; min-width:0; padding:6px 14px; font-size:13px; background:#20262c; color:var(--mut); border-radius:999px; }
  .tab.on { background:#2f3b46; color:var(--fg); }
  #lib-search, #ncm-search { width:100%; padding:10px; margin-bottom:8px; border:0; border-radius:10px; background:#242a30; color:var(--fg); font-size:15px; }
  .list .meta { flex:0 0 auto; text-align:right; color:var(--mut); font-size:12px; line-height:1.35; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .list .meta b { color:var(--fg); font-weight:500; }
  #lib-summary { margin:-2px 0 8px; }
  .meta-row { display:flex; justify-content:space-between; align-items:center; color:var(--mut); font-size:12px; margin:6px 0 10px; }
  #play-all { padding:6px 12px; font-size:13px; }
  .list .meta.err { color:#d9534f; }
  .list li.playing { background:#1e2a36; box-shadow: inset 3px 0 0 var(--acc); }
  .list li.playing .n { color:var(--acc); }
  .list li.playing .n::before { content:"▶ "; font-size:12px; }
  .volrow { display:flex; align-items:center; gap:10px; }
  .volrow input { flex:1 1 auto; }
  .volrow .act { min-width:44px; font-size:18px; padding:6px 0; }
</style>
</head>
<body>
<div class="top">
  <h1><span id="dot" class="dot"></span><span id="server">HiFi Server</span> <button class="act pwr" id="poweroff" title="Power off the board" aria-label="Power off"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg></button></h1>
  <div class="sys" id="sys" title="board status, refreshed every 3 s"></div>
</div>

<div class="card">
  <div class="title" id="title">Nothing playing</div>
  <div class="sub" id="artist"></div>
  <div class="badge" id="fmt">—</div>
  <div class="seek" id="seek" title="Tap to seek"><div class="bar"><i id="prog"></i></div></div>
  <div class="meta"><span id="elapsed">0:00</span><span id="qpos"></span><span id="duration">0:00</span></div>
</div>

<div class="card row">
  <button id="prev" aria-label="Previous">⏮</button>
  <button id="playpause" aria-label="Play">▶</button>
  <button id="stop" aria-label="Stop">⏹</button>
  <button id="next" aria-label="Next">⏭</button>
</div>
<div class="card row opts">
  <button class="act" id="repeat" aria-pressed="false">🔁 Repeat</button>
  <button class="act" id="random" aria-pressed="false">🔀 Shuffle</button>
</div>

<div class="card">
  <div class="sub">Volume <span id="volval"></span></div>
  <div class="volrow">
    <button class="act" id="vol-down" aria-label="Volume down 1%">−</button>
    <input id="vol" type="range" min="0" max="100" value="0">
    <button class="act" id="vol-up" aria-label="Volume up 1%">+</button>
  </div>
</div>

<div class="card">
  <div class="sub" style="margin-bottom:8px">Output</div>
  <select id="outputs"></select>
</div>

<div class="card">
  <div class="hdr">
    <div class="tabs">
      <button class="tab on" id="tab-ncm">NetEase</button>
      <button class="tab" id="tab-lib">Library</button>
      <button class="tab" id="tab-dl">Downloads</button>
    </div>
    <div class="row" style="flex:0 0 auto;gap:6px">
      <button class="act" id="play-all" hidden>▶ Play all</button>
      <button id="browse-back" hidden>← Back</button>
    </div>
  </div>
  <div class="sub" id="browse-title" style="margin-bottom:6px"></div>
  <input id="lib-search" placeholder="Search library…" hidden>
  <input id="ncm-search" placeholder="Search NetEase…" hidden>
  <div class="sub" id="lib-summary" hidden></div>
  <div class="syncbar">
    <div class="sub" id="dl-status"></div>
    <button class="act" id="dl-playlist" hidden>Download all</button>
  </div>
  <div id="login-panel" hidden style="text-align:center;padding:8px 0 4px">
    <div class="sub" id="login-msg">Not logged in to NetEase.</div>
    <button class="act" id="login-btn" style="margin:10px 0">Log in with QR code</button>
    <div><img id="login-qr" alt="" hidden style="width:220px;height:220px;border-radius:10px;background:#fff;padding:8px"></div>
  </div>
  <div class="sub" id="browse-status">loading…</div>
  <div id="dl-panel" hidden>
    <div class="sub" id="dl-now">Nothing downloading.</div>
    <div class="bar"><i id="dl-prog"></i></div>
    <div class="meta-row"><span id="dl-pct"></span><span style="display:flex;gap:6px"><button class="act" id="dl-pause">Pause</button><button class="act" id="dl-clear">Clear list</button></span></div>
  </div>
  <ul class="list" id="browse-list"></ul>
</div>
<script src="app.js"></script>
</body>
</html>
