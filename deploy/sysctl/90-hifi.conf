# HiFi-NetEase-Server kernel tunables (installed to /etc/sysctl.d/ by install.sh)
#
# Keep a bigger reserve of free pages. Some out-of-tree Wi-Fi drivers (Unisoc
# UWE5622 on Orange Pi boards) allocate 256 kB contiguous atomic buffers for
# receive and fail on a fragmented page cache after large downloads/uploads
# ("sdiohal_rx_thre: page allocation failure: order:6" in dmesg), which can leave
# the link dead until a reboot. 128 MB reserve on a 2 GB board.
vm.min_free_kbytes = 131072

# Start writing dirty pages to the music disk early and never let more than
# ~300 MB pile up: smooths Samba uploads and NetEase downloads instead of
# bursts followed by long stalls while the kernel flushes.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_expire_centisecs = 1500
