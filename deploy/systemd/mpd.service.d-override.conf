# /etc/systemd/system/mpd.service.d/override.conf
# Drop-in for Debian's mpd.service: wait for the USB disk, keep MPD's real-time limits,
# restart on failure. Values follow MPD's shipped unit (docs/04 §9).
[Unit]
After=srv-music.mount srv-data.mount network-online.target
RequiresMountsFor=/srv/music /srv/data

[Service]
LimitRTPRIO=40
LimitRTTIME=infinity
LimitMEMLOCK=64M
Restart=on-failure
RestartSec=2
